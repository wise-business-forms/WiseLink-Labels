<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle - light gray border -->
  <circle cx="50" cy="50" r="48" fill="#3498db" stroke="#b8b8b8" stroke-width="3"/>
  
  <!-- Inner gradient circle -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9fd8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c7fb8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="innerShadow">
      <stop offset="85%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main blue circle -->
  <circle cx="50" cy="50" r="45" fill="url(#blueGradient)"/>
  
  <!-- White W letter -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle" style="font-weight: 900;">W</text>
  
  <!-- Subtle inner shadow effect -->
  <circle cx="50" cy="50" r="45" fill="url(#innerShadow)" opacity="0.3"/>
</svg>
