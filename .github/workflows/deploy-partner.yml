name: Deploy — Channel Partner Portal

on:
  push:
    branches: [ main ]
    paths:
      - 'Sites/Partner/**'
      - 'Sites/Shared/**'
      - '.github/workflows/deploy-partner.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore Sites/Partner/WiseLabels.Partner.csproj

      - name: Build
        run: dotnet build Sites/Partner/WiseLabels.Partner.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Sites/Partner/WiseLabels.Partner.csproj --configuration Release --no-build --output partner-publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: wiselabels-partner
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PARTNER }}
          package: partner-publish
